
name: Build Grow OC APK

on:
  workflow_dispatch:
  push:
    paths:
      - '**.zip'
      - '.github/workflows/android.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Extract project ZIP
        id: extract
        shell: bash
        run: |
          mapfile -t zips < <(find . -type f -iname '*.zip' -not -path './.git/*')

          if [ "${#zips[@]}" -ne 1 ]; then
            echo "Expected exactly one ZIP archive, found ${#zips[@]}"
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/growoc"
          unzip -q "${zips[0]}" -d "$RUNNER_TEMP/growoc"

          WRAPPER=$(find "$RUNNER_TEMP/growoc" -type f -name gradlew | head -n 1)

          if [ -z "$WRAPPER" ]; then
            echo "gradlew was not found inside the ZIP"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$WRAPPER")
          chmod +x "$WRAPPER"

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Build APK
        run: |
          cd "${{ steps.extract.outputs.project_dir }}"
          ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Grow-OC-APK
          path: ${{ steps.extract.outputs.project_dir }}/**/build/outputs/apk/**/*.apk
          if-no-files-found: error
